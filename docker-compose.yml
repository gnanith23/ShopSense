services:
  # ================================================================
  # Realtime WebSocket & Notification Service (FastAPI / Python)
  # ================================================================
  realtime_service:
    build:
      context: ./realtime_service
      dockerfile: Dockerfile
    container_name: shopsense_realtime
    ports:
      - "${REALTIME_PORT:-8000}:8000"
    restart: unless-stopped

  # ================================================================
  # Primary Backend REST API (Node.js / Express / MongoDB Atlas)
  # ================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsense_backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    # Load secrets from backend/.env (MONGO_URI, JWT_SECRET, OPENROUTER_API_KEY, etc.)
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      # Internal Docker network URL for realtime service
      FASTAPI_REALTIME_URL: http://realtime_service:8000
    depends_on:
      - realtime_service
    restart: unless-stopped

  # ================================================================
  # Frontend Application (React / Vite / Nginx SPA)
  # ================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_API_URL must point to the publicly accessible backend
        # Local:  http://localhost:5000/api
        # EC2:    http://<your-ec2-public-ip>:5000/api
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
        # VITE_WS_URL must point to the publicly accessible FastAPI WebSocket service
        # Local:  ws://localhost:8000
        # EC2:    ws://<your-ec2-public-ip>:8000
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8000}
    container_name: shopsense_frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
